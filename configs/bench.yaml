# Benchmark sweep (PLAN 9.5-9.6). Run: countonce bench --config configs/bench.yaml
# No scenes are listed here: point `scenes_dir` at a folder of scene directories, each with
# images/ and gt.json ({"count": N, "tier": "easy|medium|hard"}). Nothing here is a result.
scenes_dir: data/scenes
csv: results/bench.csv
prompt_key: prompt          # gt.json key holding the text prompt (falls back to `prompt`)
prompt: object
split: test

# Opt-in external video / multi-view datasets (bench/datasets, docs/DATASETS.md). Off by default;
# set enabled: true after running scripts/download_<name>.sh. Layouts are unverified (TODO: verify).
# Video clips are subsampled to max_frames evenly spaced frames (after `stride`).
datasets:
  - {name: rgbd_videocount, root: data/RGBD-VideoCount, enabled: false, max_frames: 20}
  - {name: videocount, root: data/VideoCount, enabled: false, max_frames: 20}
  - {name: onescene, root: data/OneScene-Bench, enabled: false}

views: [3, 5, 10, 20, 40]   # 40 is VRAM-capped by the backbone
random_samples: 3           # random draws per view count ...
even_sample: true           # ... plus one evenly spaced draw
seed: 0
order: [ordered, shuffled]  # ordered video/arc order vs shuffled unordered photos
# Viewpoint spread: narrow/wide = subsets in the bottom/top tercile of angular extent around the
# camera centroid; all = no filter. narrow/wide need `camera_centers` ([[x,y,z], ...] one per
# sorted image, optional `scene_scale`) in gt.json, else those rows are skipped_no_cameras.
spread: [narrow, wide, all]

# Method / ablation grid. `kind: baseline` uses per-image counts (sum/max/median);
# `kind: countonce` overrides countonce.Config fields.
methods:
  - {name: sum, kind: baseline, baseline: sum}
  - {name: max, kind: baseline, baseline: max}
  - {name: median, kind: baseline, baseline: median}
  - {name: co_v1_vggt, kind: countonce, config: {assoc: v1, backbone: vggt}}
  - {name: co_v2_vggt, kind: countonce, config: {assoc: v2, backbone: vggt}}
  # Skipped (status=skipped_no_checkpoint) until a trained matcher exists at v3_checkpoint.
  - {name: co_v3_vggt, kind: countonce, config: {assoc: v3, backbone: vggt, v3_checkpoint: runs/match/best.pt}}
  - {name: co_sync_vggt, kind: countonce, config: {assoc: sync, backbone: vggt}}
  - {name: co_v1_colmap, kind: countonce, config: {assoc: v1, backbone: colmap}}
  # Zero-count / distractor suite (PLAN 9.8b): seeded synthetic empty/distractor scenes plus
  # wrong-prompt jobs for scenes whose gt.json lists `wrong_prompts: [...]`. Appends gt=0 rows and
  # writes zero_suite.md next to the CSV (FPR, mean false count, interval includes 0, bootstrap CI).
  - {name: zero_v2, kind: zero_suite, config: {options: {assoc: v2, backbone: vggt}, n_synthetic: 12, seed: 0}}

# One-factor-at-a-time ablations around `ablation_base`, expanded into extra methods.
ablation_base: co_v2_vggt
ablations:
  merge_k: {field: merge_k, values: [0.25, 0.5, 1.0]}
  detector: {field: detector, values: [countgd, gdino]}
  backbone: {field: backbone, values: [vggt, colmap]}
  # Only non-default values: the default is the base method itself.
  assoc: {field: assoc, values: [v1, v2]}   # v3 is the separate co_v3_vggt method
  cannot_link: {field: cannot_link, values: [false]}
  appearance: {field: appearance, values: [false]}
  # "off" is quoted: a bare off is a YAML boolean
  hallucination: {field: hallucination, values: ["off", drop]}
  lift_region: {field: lift_region, values: [box]}
  # box-centre vs mask lifting (9.6): base has no masks; `sam` needs mask_checkpoint, so only box_fill here
  masks: {field: masks, values: [box_fill]}
  negative_prompts: {field: negative_prompts, values: [false]}   # natural-language negatives off (default on)
  motion_filter: {field: motion_filter, values: [true]}   # dynamic-object residual filter (8.3b)

# Frontier-VLM baselines (PLAN 9.3 item 8). Recorded as status=skipped_paid_disabled unless the
# run passes --allow-paid AND --spend-cap-usd N AND the provider's API key variable is set.
# Uncomment and set real model ids to use; prompt is `count` or `enumerate`.
#  - {name: vlm_claude_count, kind: vlm, config: {provider: anthropic, model: MODEL_ID, prompt: count}}
#  - {name: vlm_claude_enum, kind: vlm, config: {provider: anthropic, model: MODEL_ID, prompt: enumerate}}
