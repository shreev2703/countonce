# Capture scene list (PLAN §9.2). Copy to configs/capture_scenes.yaml and edit.
# Target 20-30 independently captured static scenes, >= 3 zero-target scenes (flagged
# `zero_target: true`; they need look-alike distractors or a wrong prompt, count must be 0).
# `physical_scene` is the split unit: two captures of the same place share one id so they
# never land in different train/val/test splits.
# Fill `hand_counts` AFTER shooting, counting from the photos (two counts, a third if they
# disagree; see docs/CAPTURE_GUIDE.md). Leave it empty until then.
# Ingest one scene:
#   python scripts/ingest_captures.py --scene-list configs/capture_scenes.yaml \
#       --src <phone folder> --scene-id <id> --counts 12 12
# Tiers: easy = bike racks, chairs, shelf items; medium = plants, bins, cones;
# hard = fruit on trees, dense similar objects.
scenes:
  - id: bikes_rack
    prompt: bicycle
    tier: easy
    physical_scene: bikes_rack
    zero_target: false
    hand_counts: []   # TODO: fill after hand count
    notes: "bike rack outdoors"
