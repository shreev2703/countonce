# Profiling harness. Run: countonce profile --config configs/profile.yaml
# Writes one row per (repeat, stage) to out_csv. Nothing here is a result.
inputs: data/profile/scene   # image directory, files, or a video
prompt: mug
warmup: 1                    # untimed runs (model load, kernel autotune)
repeats: 3
out_csv: results/profile.csv
run:                         # any countonce.config.Config field
  detector: countgd
  backbone: vggt
  assoc: v1
  max_frames: 16

# Named variants for `countonce profile`: each overrides the `run:` block above. The FIRST variant
# is the baseline; speedup and count delta are measured against it. Writes variants_csv, then
# render docs/PROFILE.md with `python scripts/make_profile_report.py`. Run on the GPU only.
variants_csv: results/profile_variants.csv
variants:
  - name: baseline
  - name: compile_default
    run: {compile_reconstructor: default, compile_detector: default}
  - name: compile_reduce_overhead
    run: {compile_reconstructor: reduce-overhead, compile_detector: reduce-overhead}
  - name: det_batch_8
    run: {detector_batch_size: 8}
  - name: preload_pinned
    run: {preload_workers: 4, pin_memory: true}
  - name: sdpa_check
    run: {sdpa_check: true}
