name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .[dev,test,data]
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -m "not slow and not gpu"
      - name: Test (experimental, quarantined Moon tier)
        run: pytest experimental
      - name: Golden gate (CPU synthetic geometry)
        run: |
          python -m bench.golden compare --cpu-synthetic \
            --baseline configs/golden_cpu_baseline.json \
            --tol latency_s=off --table-out golden-cpu.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-cpu-table
          path: golden-cpu.md
          if-no-files-found: ignore

  full-cpu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: countonce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COUNTONCE_PG_URL: postgresql://postgres:postgres@localhost:5432/countonce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: pip install -e .[dev,test,data,api,db,dvc]
      # type checking needs every typed dependency installed, so it runs here only
      - name: Type check
        run: mypy
      - name: Test (report skips)
        shell: bash  # explicit bash enables pipefail, so a pytest failure is not hidden by tee
        run: pytest -m "not slow and not gpu" -rs | tee pytest-full-cpu.log
      - name: Fail on unexpected skips
        run: python scripts/check_skips.py pytest-full-cpu.log
      # backend/web schema versions agree and the committed demo assets are current
      - name: Demo assets check
        run: python scripts/build_demo.py --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # the job is a no-op while web/package.json is absent
      - id: detect
        working-directory: .
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/package.json not found; skipping Node steps"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm test --if-present
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build
      - name: Install Playwright browser
        if: steps.detect.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility (Playwright + axe)
        if: steps.detect.outputs.present == 'true'
        run: npm run test:e2e
