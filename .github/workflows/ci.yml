name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy countonce
      - name: Test
        run: pytest -m "not slow and not gpu"
      - name: Golden gate (CPU synthetic geometry)
        run: |
          python -m bench.golden compare --cpu-synthetic \
            --baseline configs/golden_cpu_baseline.json \
            --tol latency_s=off --table-out golden-cpu.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-cpu-table
          path: golden-cpu.md
          if-no-files-found: ignore

  full-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: pip install -e .[dev,test,data,api]
      - name: Type check
        run: mypy countonce
      - name: Test (report skips)
        run: pytest -m "not slow and not gpu" -rs | tee pytest-full-cpu.log
      - name: Fail on unexpected skips
        run: python scripts/check_skips.py pytest-full-cpu.log
