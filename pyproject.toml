[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countonce"
version = "0.1.0"
description = "Count anything in 3D from a few photos, without counting it twice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["countonce*"]

[tool.setuptools.package-data]
countonce = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["countonce"]
plugins = ["pydantic.mypy"]
