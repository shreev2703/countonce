[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countonce"
version = "0.1.0"
description = "Count anything in 3D from a few photos, without counting it twice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pillow",
    "pyyaml",
    "scipy",
]

[project.optional-dependencies]
recon = [
    "torch",
    "pillow",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pycolmap",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.10",
]

[project.scripts]
countonce = "countonce.cli:main"
countonce-mcp = "countonce.integrations.mcp_server:main"

[tool.setuptools.packages.find]
include = ["countonce*", "synth*"]

[tool.setuptools.package-data]
countonce = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (excluded from hosted CI)",
    "gpu: tests that need a CUDA GPU (self-hosted runner or local)",
    "golden: CPU golden synthetic-geometry regression tests",
]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["countonce"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "vggt.*", "pycolmap.*", "matplotlib.*", "groundingdino.*", "transformers.*"]
ignore_missing_imports = true
