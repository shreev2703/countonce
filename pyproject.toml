[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countonce"
version = "0.1.0"
description = "Count anything in 3D from a few photos, without counting it twice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pillow",
    "pyyaml",
    "scipy",
    # web API (countonce/api/asgi.py), installed by Vercel's uv builder; no torch/transformers
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
recon = [
    "torch",
    "pillow",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pycolmap",
]
hf = [
    "transformers>=4.45",
    "safetensors",
]
mcp = [
    "mcp>=1.0",
]
api = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]
storage = [
    "boto3>=1.34",
]
dvc = [
    "dvc>=3.0",
]
data = [
    "pyarrow>=15",
    "duckdb>=1.0",
]
test = [
    "matplotlib",
    "scipy",
    "pyyaml",
    "opencv-python-headless",
    "pillow",
    "safetensors",
    "boto3>=1.34",
    "moto[s3]>=5",
    "httpx2",  # starlette TestClient backend (httpx is deprecated there)
]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.10",
    "types-PyYAML",
    "scipy-stubs",
]

[project.scripts]
countonce = "countonce.cli:main"
countonce-mcp = "countonce.integrations.mcp_server:main"

[tool.setuptools.packages.find]
include = ["countonce*", "synth*"]

[tool.setuptools.package-data]
countonce = ["py.typed", "configs/*.yaml", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Orchestrator-owned, untracked files: not part of the project lint gate.
extend-exclude = [
    "logs",
    "scripts/hud.py",
    "scripts/dashboard.sh",
    "scripts/morning_review.sh",
    "scripts/overnight_orchestrator.sh",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "jobs_contract.py"]
addopts = "-ra"
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "slow: long-running tests (excluded from hosted CI)",
    "gpu: tests that need a CUDA GPU (self-hosted runner or local)",
    "loadtest: multi-process queue load tests (several seconds; deselect with -m 'not loadtest')",
    "golden: CPU golden synthetic-geometry regression tests",
    "postgres: needs COUNTONCE_PG_URL (skips without it)",
]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["countonce", "bench", "synth"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "vggt.*", "pycolmap.*", "matplotlib.*", "groundingdino.*", "transformers.*", "cv2.*", "mcp.*", "anthropic.*", "openai.*", "google.*", "sam2.*", "opentelemetry.*", "uvicorn.*", "pyarrow.*", "alembic.*", "psycopg.*", "duckdb.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.vercel]
entrypoint = "countonce.api.asgi:app"
