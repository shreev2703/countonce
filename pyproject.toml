[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countonce"
version = "0.1.0"
description = "Count anything in 3D from a few photos, without counting it twice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pillow",
    "pyyaml",
    "scipy",
]

[project.optional-dependencies]
recon = [
    "torch",
    "pillow",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pycolmap",
]
mcp = [
    "mcp>=1.0",
]
api = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]
data = [
    "pyarrow>=15",
    "duckdb>=1.0",
]
test = [
    "matplotlib",
    "scipy",
    "pyyaml",
    "opencv-python-headless",
    "pillow",
    "safetensors",
    "httpx2",  # starlette TestClient backend (httpx is deprecated there)
]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.10",
    "types-PyYAML",
    "scipy-stubs",
]

[project.scripts]
countonce = "countonce.cli:main"
countonce-mcp = "countonce.integrations.mcp_server:main"

[tool.setuptools.packages.find]
include = ["countonce*", "synth*"]

[tool.setuptools.package-data]
countonce = ["py.typed", "configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Orchestrator-owned, untracked files: not part of the project lint gate.
extend-exclude = [
    "logs",
    "scripts/hud.py",
    "scripts/dashboard.sh",
    "scripts/morning_review.sh",
    "scripts/overnight_orchestrator.sh",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (excluded from hosted CI)",
    "gpu: tests that need a CUDA GPU (self-hosted runner or local)",
    "loadtest: multi-process queue load tests (several seconds; deselect with -m 'not loadtest')",
    "golden: CPU golden synthetic-geometry regression tests",
]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["countonce", "bench", "synth"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "vggt.*", "pycolmap.*", "matplotlib.*", "groundingdino.*", "transformers.*", "cv2.*", "mcp.*", "anthropic.*", "openai.*", "google.*", "sam2.*", "opentelemetry.*", "uvicorn.*", "pyarrow.*", "duckdb.*"]
ignore_missing_imports = true
