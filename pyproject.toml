[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countonce"
version = "0.1.0"
description = "Count anything in 3D from a few photos, without counting it twice."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pillow",
    "pyyaml",
    "scipy",
    # web API (countonce/api/asgi.py), installed by Vercel's uv builder; no torch/transformers
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
recon = [
    "torch",
    "pillow",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pycolmap",
]
hf = [
    "transformers>=4.45",
    "safetensors",
]
# Everything the default gdino + vggt + v2 path imports, plus the data stack; used by docker/worker.Dockerfile.
# torch itself comes from the cu128 index in the Dockerfile, so the plain "torch" requirement is already met.
worker = [
    "torch",
    "torchvision",
    "pillow",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pycolmap",
    "transformers>=4.45",
    "huggingface_hub",
    "safetensors",
    "pyarrow>=15",
    "duckdb>=1.0",
    "vggt @ git+https://github.com/facebookresearch/vggt.git@a288dd0f14786c93483e45524328726ab7b1b4ce",
]
mcp = [
    "mcp>=1.0",
]
api = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]
storage = [
    "boto3>=1.34",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
dvc = [
    "dvc>=3.0",
]
data = [
    "pyarrow>=15",
    "duckdb>=1.0",
]
test = [
    "matplotlib",
    "scipy",
    "pyyaml",
    "opencv-python-headless",
    "pillow",
    "safetensors",
    "boto3>=1.34",
    "moto[s3]>=5",
    "httpx2",  # starlette TestClient backend (httpx is deprecated there)
]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.10",
    "types-PyYAML",
    "scipy-stubs",
]

[project.scripts]
countonce = "countonce.cli:main"

[tool.setuptools.packages.find]
include = ["countonce*", "synth*"]

[tool.setuptools.package-data]
countonce = ["py.typed", "configs/*.yaml", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Orchestrator-owned, untracked files: not part of the project lint gate.
extend-exclude = [
    "logs",
    "scripts/hud.py",
    "scripts/dashboard.sh",
    "scripts/morning_review.sh",
    "scripts/overnight_orchestrator.sh",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # experimental/ runs only via `pytest experimental`
python_files = ["test_*.py", "jobs_contract.py"]
addopts = "-ra"
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "slow: long-running tests (excluded from hosted CI)",
    "gpu: tests that need a CUDA GPU (self-hosted runner or local)",
    "loadtest: multi-process queue load tests (several seconds; deselect with -m 'not loadtest')",
    "golden: CPU golden synthetic-geometry regression tests",
    "postgres: needs COUNTONCE_PG_URL (skips without it)",
]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["countonce", "bench", "synth"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "vggt.*", "pycolmap.*", "matplotlib.*", "groundingdino.*", "transformers.*", "cv2.*", "mcp.*", "anthropic.*", "openai.*", "google.*", "sam2.*", "opentelemetry.*", "uvicorn.*", "pyarrow.*", "alembic.*", "psycopg.*", "duckdb.*", "boto3.*", "botocore.*", "moto.*", "huggingface_hub.*"]
ignore_missing_imports = true

# HF model code: whether these ignores are needed depends on which optional extras are installed.
[[tool.mypy.overrides]]
module = ["countonce.detect.groundingdino", "countonce.detect.masks"]
warn_unused_ignores = false

[tool.vercel]
entrypoint = "countonce.api.asgi:app"
