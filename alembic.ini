[alembic]
script_location = countonce/db/migrations
# set the URL with: alembic -x url=postgresql+psycopg://... upgrade head  (or COUNTONCE_PG_URL)

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
